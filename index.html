<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="utf-8">

<style>@font-face{font-family:Vazirmatn;font-weight:400;src:url(fonts/vazirmatn-arabic-400-normal.woff2) format('woff2')}@font-face{font-family:Vazirmatn;font-weight:700;src:url(fonts/vazirmatn-arabic-700-normal.woff2) format('woff2')}</style>
<style>
:root{--bg:#f6f1ea;--cd:#fff;--tx:#2b2118;--mu:#7a6a5b;--ac:#8a5a2b;--ax:#fff;--bd:#e4d9cb;--rd:#c0392b;--gr:#2e7d4f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1c1713;--cd:#2a231c;--tx:#f1e8dc;--mu:#a8998a;--ac:#d09a5e;--ax:#1c1713;--bd:#41372c;--rd:#ff7b6b;--gr:#6fcf97}}
:root[data-theme=dark]{--bg:#1c1713;--cd:#2a231c;--tx:#f1e8dc;--mu:#a8998a;--ac:#d09a5e;--ax:#1c1713;--bd:#41372c;--rd:#ff7b6b;--gr:#6fcf97}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.7 Vazirmatn,Tahoma,sans-serif}
#app{padding:14px 14px 90px;max-width:640px;margin:auto}
h1{font-size:20px;margin:6px 0 12px}h2{font-size:16px;margin:18px 0 8px}small,.mu{color:var(--mu);font-size:12px;display:block}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.k{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:10px}.k b{font-size:17px;display:block}
.k.w{grid-column:1/-1}.rd{color:var(--rd)}.gr{color:var(--gr)}
.row{display:flex;gap:8px;margin:10px 0}
.b{flex:1;background:var(--ac);color:var(--ax);border:0;border-radius:10px;padding:11px;font:inherit;font-weight:700}
.b.o{background:transparent;color:var(--ac);border:1.5px solid var(--ac)}.b.s{flex:none;padding:6px 14px}.b.d{background:var(--rd);color:#fff}
.it{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin:6px 0;display:flex;justify-content:space-between;align-items:center;gap:8px}
input,select,textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:9px;margin:4px 0}
label{font-size:12px;color:var(--mu)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--cd);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;color:var(--mu);font:inherit;font-size:11px;padding:8px 0}nav button.on{color:var(--ac);font-weight:700}
.sh{display:none;position:fixed;inset:0;background:var(--bg);overflow:auto;z-index:20;padding-top:env(safe-area-inset-top,0px)}.sh.on{display:block}
.pn{padding:14px;max-width:640px;margin:auto;padding-bottom:40px}.x{background:none;border:0;color:var(--mu);font-size:22px}
.ir{display:flex;gap:4px;align-items:center}.ir .n{width:60px}.ir .w{width:95px}.x2{background:none;border:0;color:var(--rd);font-size:16px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{border-bottom:1px solid var(--bd);padding:5px 2px;text-align:right}
.sp{display:flex;justify-content:space-between;padding:3px 0}.t{font-weight:700;font-size:17px;border-top:2px solid var(--tx);margin-top:6px}
#paper{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:14px}
.bar{height:8px;border-radius:4px;background:var(--ac);margin:2px 0}.bar.p{background:var(--gr)}
#ts{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:20px;display:none;z-index:30}
:root{--bg:#f3fafb;--cd:#fff;--bd:#d9eaed;--ac:#0e8a8a;--ax:#fff;--tx:#12343b;--mu:#5f7c82;--gr:#16996a;--rd:#d64545}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1b1e;--cd:#182529;--bd:#26383d;--ac:#4fd1c5;--ax:#0f1b1e;--tx:#e6f2f2;--mu:#8fa7aa}}
:root[data-theme=dark]{--bg:#0f1b1e;--cd:#182529;--bd:#26383d;--ac:#4fd1c5;--ax:#0f1b1e;--tx:#e6f2f2;--mu:#8fa7aa}
#app{padding-top:20px}
h1{font-size:22px;margin:4px 0 14px}
h2{font-size:13px;color:var(--mu);margin:24px 4px 8px}
.k,.it,#paper{border:0;border-radius:16px;box-shadow:0 1px 2px rgba(60,40,20,.06),0 6px 16px rgba(60,40,20,.07)}
.g{gap:10px}
.k{padding:14px}.k b{font-size:18px}
.k.w{order:-1;padding:20px;background:linear-gradient(135deg,#19b394,#0b6fa8);color:#fff}.k.w small{color:#ffffffbb;font-size:13px}.k.w b,.k.w b.rd{font-size:30px;color:#fff}
.it{padding:14px;margin:8px 0}
.b{border-radius:14px;padding:14px;box-shadow:0 3px 10px rgba(14,138,138,.3)}
.b.o{background:var(--cd);border:0;box-shadow:0 1px 2px rgba(60,40,20,.08),0 4px 10px rgba(60,40,20,.05)}
.b.d{box-shadow:none}
input,select,textarea{background:var(--cd);border:1.5px solid var(--bd);border-radius:12px;padding:12px;margin:6px 0 12px}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--ac)}
.ir input{margin:4px 0}
label{display:block;font-size:13px;margin-top:6px}
nav{border:0;box-shadow:0 -4px 20px rgba(60,40,20,.1);padding:6px 8px}
nav button{border-radius:14px;padding:6px 0;line-height:1.5}nav button::first-line{font-size:20px}
nav button.on{background:color-mix(in srgb,var(--ac) 15%,transparent)}
.x{width:38px;height:38px;border-radius:50%;background:var(--cd);box-shadow:0 1px 6px rgba(60,40,20,.15);font-size:18px;margin-bottom:8px}
.rb{background:var(--cd);border-radius:14px;padding:8px;margin:8px 0;box-shadow:0 1px 2px rgba(60,40,20,.06),0 4px 12px rgba(60,40,20,.06)}.rb input{background:var(--bg)}.nt{font-size:13px;margin:2px 0 0!important}
@keyframes up{from{opacity:0;transform:translateY(12px)}}
@keyframes fd{from{opacity:0}}
@keyframes sl{from{opacity:0;transform:translateY(28px)}}
@keyframes gw{from{transform:scaleX(0)}}
#app>*,.it,.k,.rb{animation:up .5s cubic-bezier(.2,.7,.2,1) backwards}
.g .k:nth-child(2){animation-delay:.06s}.g .k:nth-child(3){animation-delay:.12s}
.it:nth-child(2){animation-delay:.05s}.it:nth-child(3){animation-delay:.1s}.it:nth-child(4){animation-delay:.15s}.it:nth-child(n+5){animation-delay:.2s}
.sh.on{animation:fd .25s ease}.sh.on .pn{animation:sl .45s cubic-bezier(.2,.7,.2,1) backwards}
.bar{transform-origin:right;animation:gw .9s cubic-bezier(.2,.7,.2,1) backwards .15s}
#ts{animation:up .3s ease}
.b,.it,nav button,.x{transition:transform .18s ease,box-shadow .25s ease,background .3s ease,color .3s ease}
.b:active,.x:active{transform:scale(.96)}.it:active{transform:scale(.985)}
input,select,textarea{transition:border-color .25s ease,box-shadow .25s ease}
input:focus,select:focus,textarea:focus{box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 15%,transparent)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#paper{padding:18px}
@media print{body *{visibility:hidden}#paper,#paper *{visibility:visible}#paper{position:absolute;top:0;left:0;right:0;border:0;color:#000;background:#fff}}
</style></head><body>
<div id="app"></div>
<nav><button data-v="home" onclick="go('home')">🏠<br>خانه</button><button data-v="inv" onclick="go('inv')">🧾<br>صورتحساب</button><button data-v="cust" onclick="go('cust')">👥<br>مشتریان</button><button data-v="rep" onclick="go('rep')">📊<br>گزارش</button><button data-v="set" onclick="go('set')">⚙️<br>تنظیمات</button></nav>
<div class="sh" id="sh"><div class="pn"><button class="x" onclick="closeS()">✕</button><div id="shb"></div></div></div>
<div id="ts"></div>
<script>
const $=s=>document.querySelector(s),div=(a,b)=>~~(a/b);
const MN=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
function g2j(gy,gm,gd){const g=[0,31,59,90,120,151,181,212,243,273,304,334],y2=gm>2?gy+1:gy;let d=355666+365*gy+div(y2+3,4)-div(y2+99,100)+div(y2+399,400)+gd+g[gm-1],jy=-1595+33*div(d,12053);d%=12053;jy+=4*div(d,1461);d%=1461;if(d>365){jy+=div(d-1,365);d=(d-1)%365}return[jy,d<186?1+div(d,31):7+div(d-186,30),1+(d<186?d%31:(d-186)%30)]}
const fa=n=>Math.round(n).toLocaleString('fa-IR'),fq=n=>(+n).toLocaleString('fa-IR'),faD=s=>String(s||'').replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const en=s=>String(s).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[,٬،\s]/g,'');
const num=s=>parseFloat(en(s))||0,p2=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date(),j=g2j(d.getFullYear(),d.getMonth()+1,d.getDate());return j[0]+'/'+p2(j[1])+'/'+p2(j[2])};
const nd=s=>{const a=en(s).split(/[\/\-.]/);return a.length==3?a[0]+'/'+p2(+a[1])+'/'+p2(+a[2]):s};
const mname=k=>MN[+k.slice(5,7)-1]+' '+faD(k.slice(0,4));
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const DEF={c:[],i:[],p:[],s:{shop:'کارگاه نجاری',phone:'',seq:0,tpl:'سلام {name} عزیز، مانده حساب شما نزد {shop} مبلغ {amt} تومان است. لطفاً در اولین فرصت تسویه فرمایید. با تشکر'}};
let db;try{db=JSON.parse(localStorage.getItem('wsh1'))}catch(e){}db=db||DEF;
const save=()=>{window.nbQ&&window.nbQ();try{localStorage.setItem('wsh1',JSON.stringify(db))}catch(e){toast('ذخیره‌سازی ممکن نیست')}};
let view='home',draft,pf;
const tot=x=>x.items.reduce((a,i)=>a+i.q*i.p,0)-(x.disc||0);
const bal=id=>db.i.filter(x=>x.cid===id).reduce((a,x)=>a+tot(x),0)-db.p.filter(x=>x.cid===id).reduce((a,x)=>a+x.amt,0);
const cu=id=>db.c.find(c=>c.id===id)||{name:'(حذف‌شده)'};
function toast(t){const e=$('#ts');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2000)}
function go(v){view=v;render()}
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));$('#app').innerHTML=({home:vHome,cust:vCust,inv:vInv,rep:vRep,set:vSet})[view]()}
function openS(h){$('#shb').innerHTML=h;$('#sh').classList.add('on');$('#sh').scrollTop=0}
function closeS(){$('#sh').classList.remove('on');render()}
const smsUrl=(ph,t)=>'sms:'+en(ph||'')+(/iPhone|iPad/.test(navigator.userAgent)?'&':'?')+'body='+encodeURIComponent(t);
function sms(ph,t){const u=smsUrl(ph,t);try{top.location.href=u}catch(e){location.href=u}}
const tpl=c=>db.s.tpl.replace('{name}',c.name).replace('{shop}',db.s.shop).replace('{amt}',fa(bal(c.id)));
function remind(id){const c=cu(id);c.rm=today().slice(0,7);save();render();msgPanel(id,tpl(c),'')}
function vHome(){const m=today().slice(0,7),S=db.i.filter(x=>x.date.startsWith(m)).reduce((a,x)=>a+tot(x),0),P=db.p.filter(x=>x.date.startsWith(m)).reduce((a,x)=>a+x.amt,0),D=db.c.reduce((a,c)=>a+Math.max(bal(c.id),0),0),ds=db.c.filter(c=>bal(c.id)>0&&c.rm!==m);
return`<h1 style="display:flex;align-items:center;gap:10px">${LOGO}${esc(db.s.shop)}</h1><small style="margin:-10px 0 14px">${faD(today())}</small><div class="g"><div class="k"><small>فروش این ماه</small><b>${fa(S)}</b></div><div class="k"><small>دریافتی این ماه</small><b class="gr">${fa(P)}</b></div><div class="k w"><small>مجموع بدهی مشتریان (تومان)</small><b class="rd">${fa(D)}</b></div></div>
<div class="row"><button class="b" onclick="invForm()">+ صورتحساب</button><button class="b o" onclick="payForm()">+ دریافتی</button></div>
<h2>یادآوری ${mname(m)}</h2>${ds.length?ds.map(c=>`<div class="it"><div>${esc(c.name)}<small>بدهی: ${fa(bal(c.id))} تومان</small></div><button class="b s" onclick="remind('${c.id}')">📩 پیامک</button></div>`).join(''):'<p class="mu">همه بدهکاران این ماه یادآوری شدند ✓</p>'}`}
function custList(q){const l=db.c.filter(c=>(c.name+c.phone).includes(q||''));return l.length?l.map(c=>{const b=bal(c.id);return`<div class="it" onclick="custView('${c.id}')"><div>${esc(c.name)}<small>${faD(c.phone)}</small></div><b class="${b>0?'rd':b<0?'gr':''}">${fa(Math.abs(b))}<small>${b>0?'بدهکار':b<0?'بستانکار':'تسویه'}</small></b></div>`}).join(''):'<p class="mu">مشتری‌ای ثبت نشده.</p>'}
function vCust(){return`<h1>مشتریان</h1><div class="row"><input placeholder="جستجو..." oninput="$('#cl').innerHTML=custList(this.value)"><button class="b s" onclick="custForm()">+ جدید</button></div><div id="cl">${custList()}</div>`}
function custForm(){openS(`<h2>مشتری جدید</h2><label>نام</label><input id="cn"><label>تلفن همراه</label><input id="cp" inputmode="tel"><button class="b" style="width:100%" onclick="saveCust()">ذخیره</button>`)}
function saveCust(){const n=$('#cn').value.trim();if(!n)return toast('نام را بنویسید');db.c.push({id:uid(),name:n,phone:en($('#cp').value)});save();closeS()}
function custView(id){const c=cu(id),b=bal(id),L=[...db.i.filter(x=>x.cid===id).map(x=>({t:'i',d:x.date,x})),...db.p.filter(x=>x.cid===id).map(x=>({t:'p',d:x.date,x}))].sort((a,b)=>b.d.localeCompare(a.d));
openS(`<h1>${esc(c.name)}</h1><small>${faD(c.phone)}</small><div class="k" style="margin:10px 0"><small>مانده حساب (تومان)</small><b class="${b>0?'rd':'gr'}">${fa(Math.abs(b))} ${b>0?'بدهکار':b<0?'بستانکار':''}</b></div>
<div class="row"><button class="b" onclick="invForm('${id}')">+ صورتحساب</button><button class="b o" onclick="payForm('${id}')">+ دریافتی</button></div>
<div class="row"><button class="b o" onclick="msgPanel('${id}',tpl(cu('${id}')),'c:${id}')">📩 پیامک مانده حساب</button></div>
${L.map(r=>r.t=='i'?`<div class="it" onclick="invView('${r.x.id}')"><div>صورتحساب ${fa(r.x.no)}<small>${faD(r.d)}</small></div><b>${fa(tot(r.x))}</b></div>`:`<div class="it"><div class="gr">دریافت ${r.x.note?'· '+esc(r.x.note):''}<small>${faD(r.d)}</small></div><div><b class="gr">${fa(r.x.amt)}</b> <button class="x2" onclick="delP('${r.x.id}','${id}')">🗑</button></div></div>`).join('')}
<div class="row"><button class="b d" onclick="delC('${id}')">حذف مشتری</button></div>`)}
function delP(id,c){if(confirm('این دریافتی حذف شود؟')){db.p=db.p.filter(x=>x.id!==id);save();custView(c)}}
function delC(id){if(confirm('مشتری و همه‌ی صورتحساب‌ها و دریافتی‌هایش حذف شود؟')){db.c=db.c.filter(x=>x.id!==id);db.i=db.i.filter(x=>x.cid!==id);db.p=db.p.filter(x=>x.cid!==id);save();closeS()}}
function vInv(){const l=[...db.i].sort((a,b)=>b.date.localeCompare(a.date)||b.no-a.no);return`<h1>صورتحساب‌ها</h1><div class="row"><button class="b" onclick="invForm()">+ صورتحساب جدید</button></div>${l.map(x=>`<div class="it" onclick="invView('${x.id}')"><div>${fa(x.no)} · ${esc(cu(x.cid).name)}<small>${faD(x.date)}</small></div><b>${fa(tot(x))}</b></div>`).join('')||'<p class="mu">هنوز صورتحسابی ثبت نشده.</p>'}`}
const O=k=>k=='d'?draft:pf;
const pick=k=>`<label>مشتری</label><input id="${k}q" placeholder="🔍 جستجوی نام یا شماره مشتری..." value="${esc(cu(O(k).cid).name)}" onfocus="this.select()" oninput="pl('${k}')" autocomplete="off"><div id="${k}l"></div><small class="gr" id="${k}s" style="margin:-6px 0 8px">✓ ${esc(cu(O(k).cid).name)}</small>`;
function pl(k){const nz=s=>s.replace(/ي/g,'ی').replace(/ك/g,'ک'),q=nz($('#'+k+'q').value.trim()),l=q?db.c.filter(c=>nz(c.name).split(/\s+/).some(w=>w.startsWith(q))||(c.phone||'').includes(en(q))).slice(0,6):[];$('#'+k+'l').innerHTML=l.map(c=>`<div class="it" onclick="pc('${k}','${c.id}')"><span>${esc(c.name)}</span><small>${faD(c.phone)}</small></div>`).join('')||(q?'<p class="mu">مشتری پیدا نشد</p>':'')}
function pc(k,id){O(k).cid=id;$('#'+k+'q').value=cu(id).name;$('#'+k+'s').textContent='✓ '+cu(id).name;$('#'+k+'l').innerHTML=''}
const opts=s=>db.c.map(c=>`<option value="${c.id}" ${c.id===s?'selected':''}>${esc(c.name)}</option>`).join('');
const dt=()=>draft.items.reduce((a,r)=>a+(r.q||0)*(r.p||0),0)-(draft.disc||0);
const tt=()=>$('#tt').textContent=fa(dt())+' تومان';
function rowsH(){return draft.items.map((r,i)=>`<div class="rb"><div class="ir"><input placeholder="شرح (مثلاً کابینت)" value="${esc(r.d)}" oninput="draft.items[${i}].d=this.value"><input class="n" inputmode="decimal" placeholder="تعداد" value="${r.q}" oninput="draft.items[${i}].q=num(this.value);tt()"><input class="w" inputmode="numeric" placeholder="فی (تومان)" value="${r.p}" oninput="draft.items[${i}].p=num(this.value);tt()"><button class="x2" onclick="draft.items.splice(${i},1);if(!draft.items.length)draft.items.push({d:'',q:1,p:''});$('#rw').innerHTML=rowsH();tt()">✕</button></div><input class="nt" placeholder="توضیحات این ردیف (اختیاری)" value="${esc(r.n||'')}" oninput="draft.items[${i}].n=this.value"></div>`).join('')}
function invForm(cid,ed){if(!db.c.length){toast('اول یک مشتری ثبت کنید');return custForm()}
