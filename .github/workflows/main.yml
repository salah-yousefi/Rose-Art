name: Build APK
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Setup
        run: |
          mkdir -p www/fonts
          cp index.html www/index.html
          rm -f assets/icon.png
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/assets @fontsource/vazirmatn
          cp node_modules/@fontsource/vazirmatn/files/vazirmatn-arabic-*-normal.woff2 www/fonts/
          npx cap init "Rose Art" com.rozart.accounting --web-dir=www
          npx cap add android
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n<application#' android/app/src/main/AndroidManifest.xml
          npx capacitor-assets generate --android
          npx cap sync android
      - name: Build
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          mkdir -p ~/.android
          base64 -d > ~/.android/debug.keystore <<'EOF'
          MIIEYgIBAzCCBAwGCSqGSIb3DQEHAaCCA/0EggP5MIID9TCCATwGCSqGSIb3DQEH
