name: Build APK
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup
        run: |
          mkdir -p www/fonts
          cp index.html www/index.html
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @fontsource/vazirmatn
          cp node_modules/@fontsource/vazirmatn/files/vazirmatn-arabic-*-normal.woff2 www/fonts/
          npx cap init "Rose Art" com.rozart.accounting --web-dir=www
          npm i @capacitor/assets
          npx capacitor-assets generate --android
          npx cap add android
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n<application#' android/app/src/main/AndroidManifest.xml
          npx cap sync android
      - name: Build
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
