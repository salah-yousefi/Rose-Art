          keytool -list -keystore ~/.android/debug.keystore -storepass android | head -5
          cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Rename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk RoseArt.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Rose Art ${{ github.run_number }}
          files: RoseArt.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
